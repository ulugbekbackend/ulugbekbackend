name: generate animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake-dark.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ulugbekbackend
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300F7FF&color_dots=%23161b22,%23003847,%23005f73,%23008ea3,%2300F7FF&color_background=%230d1117

      - name: push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
